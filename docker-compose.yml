version: "3.8"

services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: facedetect-db
    environment:
      POSTGRES_USER: facedetect
      POSTGRES_PASSWORD: facedetect
      POSTGRES_DB: facedetect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facedetect"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facedetect-backend
    environment:
      DATABASE_URL: postgresql://facedetect:facedetect@db:5432/facedetect
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - processed:/app/processed
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facedetect-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  processed:
